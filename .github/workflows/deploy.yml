# FASE 4 - , SAST, SCA
name: Deploy mejorado [SAST, SCA]

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-tests:
    name: ci-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas unitarias
        run: ./mvnw test

sast-semgrep:
  name: Análisis SAST (Semgrep)
  runs-on: ubuntu-latest
  steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Instalar y ejecutar Semgrep
      run: |
        python3 -m pip install semgrep
        semgrep scan --config p/java --error

  sca-trivy:
    name: Análisis SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Descargar dependencias de Maven
        run: ./mvnw dependency:resolve

      - name: Escanear vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          security-checks: 'vuln'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  build-and-deploy:
    name: Empaquetado y despliegue
    runs-on: ubuntu-latest
    needs: [ci-tests, sast-semgrep, sca-trivy]
    environment: production
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar (sin ejecutar pruebas)
        run: ./mvnw package -DskipTests

      - name: Copiar JAR a EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "~/spring_backend/"
          strip_components: 1

      - name: Reiniciar app en EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart spring_backend